<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Vocabulario</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Nunito+Sans:ital,wght@0,400;0,600;1,400&display=swap">
<style>body{margin:0}a{text-decoration:none}button{font-family:inherit;cursor:pointer}</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#F5EDE0;font-family:'Nunito Sans',sans-serif;color:#23302A">
<svg role="img" aria-label="Ilustración de la selva del territorio Awá con montañas, palmas, hojas grandes y un tucán" viewBox="0 0 390 168" preserveAspectRatio="xMidYMin slice" style="position:absolute;left:0;top:0;width:390px;height:168px">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CFE3D2"/><stop offset=".7" stop-color="#EEF0DA"/><stop offset="1" stop-color="#F6EBD2"/></linearGradient>
<radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFE7A8" stop-opacity=".95"/><stop offset="1" stop-color="#FFE7A8" stop-opacity="0"/></radialGradient>
<g id="palm"><path d="M0 0 Q3 -22 0 -44" stroke="#2F5A43" stroke-width="3.200" fill="none" stroke-linecap="round"/><g stroke="#2C6049" stroke-width="3" fill="none" stroke-linecap="round"><path d="M0 -44 Q16 -58 34 -46"/><path d="M0 -44 Q-16 -58 -34 -46"/><path d="M0 -44 Q12 -64 26 -62"/><path d="M0 -44 Q-12 -64 -26 -62"/><path d="M0 -44 Q2 -66 0 -72"/><path d="M0 -44 Q22 -48 38 -34"/><path d="M0 -44 Q-22 -48 -38 -34"/></g></g>
<g id="leaf"><path d="M0 0 C26 -44 92 -58 140 -22 C104 -12 56 8 0 0Z" fill="#2E6B4E"/><path d="M4 -2 C40 -22 86 -30 128 -22" stroke="#9BC7A0" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M30 -12 l8 14 M54 -20 l10 12 M80 -26 l10 10" stroke="#5E9A79" stroke-width="1.600" stroke-linecap="round"/></g>
</defs>
<rect width="390" height="168" fill="url(#sky)"/>
<circle cx="300" cy="50" r="80" fill="url(#sun)"/>
<g fill="#fff" opacity=".6"><ellipse cx="82" cy="34" rx="44" ry="6"/><ellipse cx="318" cy="22" rx="38" ry="5"/></g>
<path d="M0 92 Q50 64 100 84 T200 76 T300 86 T390 72 V168 H0Z" fill="#A2C8AE"/>
<ellipse cx="120" cy="100" rx="150" ry="8" fill="#fff" opacity=".5"/>
<path d="M0 116 Q70 88 140 108 T270 104 T390 98 V168 H0Z" fill="#74AC8C"/>
<path d="M0 138 Q80 114 170 134 T390 124 V168 H0Z" fill="#4C8B6C"/>
<use href="#palm" transform="translate(64,140) scale(.55)"/><use href="#palm" transform="translate(104,144) scale(.44)"/><use href="#palm" transform="translate(262,134) scale(.5)"/>
<path d="M0 150 Q60 136 108 154 L124 168 H0Z" fill="#2F6B4E"/>
<use href="#leaf" transform="translate(-6,166) rotate(-30) scale(.8)"/>
<path d="M390 128 Q350 120 306 130" stroke="#6B4A2E" stroke-width="6" fill="none" stroke-linecap="round"/>
<g transform="translate(338,76) scale(.8)"><ellipse cx="0" cy="22" rx="15" ry="22" fill="#1B1B1B"/><ellipse cx="-3" cy="18" rx="8" ry="12" fill="#F4ECDD"/><circle cx="-4" cy="-4" r="11" fill="#1B1B1B"/><path d="M-12 -8 Q-44 -12 -52 2 Q-34 12 -12 2Z" fill="#E8A33D"/><path d="M-12 -8 Q-34 -10 -52 2 Q-32 -2 -12 -2Z" fill="#C84A1F"/><circle cx="-7" cy="-6" r="3.600" fill="#fff"/><circle cx="-7.500" cy="-6" r="1.800" fill="#000"/><path d="M4 42 l10 18 l-18 -8Z" fill="#1B1B1B"/></g>
<path d="M0 156 Q70 146 140 154 T280 152 T390 146 V168 H0Z" fill="#F5EDE0"/>
</svg>
<a href="AwaPit.dc.html" aria-label="Volver" style="position:absolute;left:14px;top:30px;width:44px;height:44px;border-radius:50%;background:rgba(251,243,230,.9);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(40,30,10,.15)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F4D3A" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></a>
<div style="position:absolute;left:68px;top:30px"><h1 style="margin:0;font-family:'Outfit',sans-serif;font-weight:800;font-size:26px;line-height:30px;color:#1F4D3A">Vocabulario</h1><div style="font-size:13px;line-height:16px;color:#33423B;margin-top:1px">Awá Pit · 24 de 100 palabras</div></div>
<label style="position:absolute;left:20px;right:20px;top:144px;box-sizing:border-box;display:flex;align-items:center;gap:10px;height:52px;padding:0 14px;border-radius:26px;background:#fff;border:2px solid #CFE0D2;box-shadow:0 3px 10px rgba(40,70,50,.14)"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2F6F4E" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input type="text" onInput="{{onSearch}}" placeholder="Buscar palabra…" aria-label="Buscar palabra" style="flex:1;min-width:0;border:0;background:transparent;outline:0;font-family:'Nunito Sans',sans-serif;font-size:15px;color:#23302A"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A8472" stroke-width="1.900" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></label>
<div style="position:absolute;left:20px;right:20px;top:212px;display:flex;gap:8px;overflow-x:auto">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="4"><button onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="flex:none;height:40px;padding:0 16px;border-radius:20px;border:1.5px solid {{c.border}};background:{{c.bg}};color:{{c.fg}};font-family:'Outfit',sans-serif;font-weight:600;font-size:14px">{{c.label}}</button></sc-for></div>
<div style="position:absolute;left:20px;right:20px;top:266px;display:flex;flex-direction:column;gap:10px">
<sc-for list="{{words}}" as="w" hint-placeholder-count="5">
<div style="display:flex;align-items:center;gap:14px;height:84px;box-sizing:border-box;padding:0 14px 0 12px;border-radius:18px;background:#FBF3E6;border:1px solid #EADFCB;box-shadow:0 1px 4px rgba(60,40,10,.06)">
<button aria-label="Escuchar {{w.word}}" style="width:50px;height:50px;border-radius:50%;border:0;background:linear-gradient(135deg,#2F6F4E,#4C8B6C);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 3px 8px rgba(47,111,78,.3)"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.900" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9zM16.500 8.500a5 5 0 0 1 0 7M19 6a8.500 8.500 0 0 1 0 12"/></svg></button>
<div style="flex:1;min-width:0"><div style="font-family:'Outfit',sans-serif;font-weight:800;font-size:21px;line-height:25px;color:#1F2D27">{{w.word}}</div><div style="font-size:14px;color:#4B554F;line-height:18px">{{w.tr}}</div></div>
<div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px"><span style="font-size:11.500px;font-weight:700;padding:3px 10px;border-radius:12px;background:{{w.tagBg}};color:{{w.tagFg}}">{{w.tag}}</span>
<span role="img" aria-label="Dominio {{w.level}} de 3" style="display:flex;gap:4px"><sc-for list="{{w.dots}}" as="d" hint-placeholder-count="3"><span style="width:9px;height:9px;border-radius:50%;background:{{d}}"></span></sc-for></span></div></div>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{false}}"><div style="padding:28px 16px;text-align:center;border-radius:18px;background:#FBF3E6;border:1px dashed #D9CBB0"><div style="font-family:'Outfit',sans-serif;font-weight:700;font-size:16px;color:#1F4D3A">No encontramos esa palabra</div><div style="font-size:13px;color:#5E645B;margin-top:4px">Prueba con otra o cambia de categoría.</div></div></sc-if></div>
<nav aria-label="Navegación principal" style="position:absolute;left:0;right:0;bottom:0;height:82px;background:#FBF3E6;border-top:1px solid #EADFCB;display:flex;padding-bottom:6px;box-sizing:border-box">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4"><a href="{{t.href}}" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:{{t.color}};font-size:11.500px;font-weight:{{t.weight}};font-family:'Outfit',sans-serif"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.700" stroke-linecap="round" stroke-linejoin="round"><path d="{{t.d}}"/></svg>{{t.label}}</a></sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
state = { cat: 'Todos', q: '' };
renderVals() {
const act = 1;
const base = [
{label:'Inicio',href:'Inicio.dc.html',d:'M3 11l9-8 9 8v10h-6v-6H9v6H3z'},
{label:'Aprender',href:'Lenguas.dc.html',d:'M4 5a2 2 0 0 1 2-2h6v16H6a2 2 0 0 0-2 2zM20 5a2 2 0 0 0-2-2h-6v16h6a2 2 0 0 1 2 2z'},
{label:'Mapa',href:'Mapa.dc.html',d:'M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21zM12 7.5a2.2 2.2 0 1 0 0 4.4 2.2 2.2 0 0 0 0-4.4z'},
{label:'Explorar',href:'Explorar.dc.html',d:'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM15.5 8.5l-2 5-5 2 2-5z'}];
const { cat: cur, q } = this.state;
const chips = ['Todos','Salud','Naturaleza','Cultura'].map(l => ({label:l, pick:()=>this.setState({cat:l}), pressed: l===cur ? 'true' : 'false',
bg: l===cur ? '#2F6F4E' : '#FBF3E6', fg: l===cur ? '#fff' : '#23302A', border: l===cur ? '#2F6F4E' : '#EADFCB'}));
const tags = {
'Familia':['#FBE3D6','#8E2F22'],'Acción':['#E6DDF3','#4A2F78'],'Concepto':['#DCEBDD','#1F4D3A'],'Adjetivo':['#F8E4C0','#7A4A05'],'Naturaleza':['#D9E9F4','#1D4A75']};
const all = [
{word:'taita',tr:'Padre / Abuelo',tag:'Familia',cat:'Cultura',level:3},
{word:'yachay',tr:'Conocer / Aprender',tag:'Acción',cat:'Cultura',level:2},
{word:'kawsay',tr:'Vida',tag:'Concepto',cat:'Salud',level:1},
{word:'sumak',tr:'Hermoso / Bonito',tag:'Adjetivo',cat:'Cultura',level:2},
{word:'pacha',tr:'Tierra / Mundo',tag:'Naturaleza',cat:'Naturaleza',level:3}];
const needle = q.trim().toLowerCase();
const words = all.filter(w => (cur==='Todos' || w.cat===cur) && (!needle || (w.word + ' ' + w.tr).toLowerCase().includes(needle)))
.map(w => ({...w, tagBg: tags[w.tag][0], tagFg: tags[w.tag][1], dots: [1,2,3].map(n => n <= w.level ? '#C84A1F' : '#E6DAC4')}));
return { tabs: base.map((t,i)=>({...t,color: i===act ? '#C84A1F' : '#4A4740', weight: i===act ? 700 : 500})), chips, words, empty: words.length === 0,
onSearch: (e) => this.setState({ q: e.target.value }) };
}
}
</script>
</body>
</html>
