<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
state = { sel: null, checked: false };
renderVals() {
const act = 1;
const base = [
{label:'Inicio',href:'Inicio.dc.html',d:'M3 11l9-8 9 8v10h-6v-6H9v6H3z'},
{label:'Aprender',href:'Lenguas.dc.html',d:'M4 5a2 2 0 0 1 2-2h6v16H6a2 2 0 0 0-2 2zM20 5a2 2 0 0 0-2-2h-6v16h6a2 2 0 0 1 2 2z'},
{label:'Mapa',href:'Mapa.dc.html',d:'M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21zM12 7.5a2.2 2.2 0 1 0 0 4.4 2.2 2.2 0 0 0 0-4.4z'},
{label:'Explorar',href:'Explorar.dc.html',d:'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM15.5 8.5l-2 5-5 2 2-5z'}];
const { sel, checked } = this.state;
const correct = 'A';
const ok = sel === correct;
const opts = [['A','kachik'],['B','taita'],['C','pacha']].map(([k,w]) => {
const on = sel === k;
let border = '#EADFCB', bg = '#FBF3E6', badge = '#F1E6D0', badgeFg = '#23302A', hasIcon = false, iconD = '';
if (on) { border = '#C84A1F'; bg = '#FDF0E6'; badge = '#C84A1F'; badgeFg = '#fff'; }
if (checked && on) { border = ok ? '#2F6F4E' : '#B3261E'; bg = ok ? '#E4EFE6' : '#FBE4E1'; badge = border; hasIcon = true; iconD = ok ? 'M5 12.500l4.500 4.500L19 7.500' : 'M6 6l12 12M18 6L6 18'; }
return { k, w, checked: on ? 'true' : 'false', border, bg, badge, badgeFg, hasIcon, noIcon: !hasIcon, iconD, pick: () => this.setState({ sel: k, checked: false }) };
});
const canVerify = !!sel;
const showVerify = !(checked && ok);
const retry = checked && !ok;
return {
tabs: base.map((t,i)=>({...t,color: i===act ? '#C84A1F' : '#4A4740', weight: i===act ? 700 : 500})),
steps: ['#2F6F4E','#2F6F4E','#C84A1F','#E6DAC4','#E6DAC4'],
opts, checked, showVerify, showContinue: checked && ok,
verify: () => { if (this.state.checked && !ok) this.setState({ sel: null, checked: false }); else if (this.state.sel) this.setState({ checked: true }); },
disabled: (!canVerify && !retry) ? 'true' : 'false',
btnLabel: retry ? 'Intentar de nuevo' : 'Verificar',
btnBg: (canVerify || retry) ? '#C84A1F' : '#E6DAC4', btnFg: (canVerify || retry) ? '#fff' : '#6F6A5B',
btnShadow: (canVerify || retry) ? '0 3px 10px rgba(200,74,31,.3)' : 'none',
msg: ok ? '¡Muy bien! “kachik” significa “ave” en Awá Pit.' : 'Casi. Intenta de nuevo.',
msgColor: ok ? '#1F5C3A' : '#9A1C14', msgBg: ok ? '#E4EFE6' : '#FBE4E1' };
}
}
</script>
